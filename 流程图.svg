<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8faf7"/>
      <stop offset="58%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef7ed"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg { fill: url(#bgGrad); }
      .title { font: 800 42px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; letter-spacing: 1px; }
      .subtitle { font: 500 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .section { font: 800 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; letter-spacing: .5px; }
      .node-title { font: 800 24px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; }
      .node-text { font: 17px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .tiny { font: 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #64748b; }
      .tag { font: 700 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; }
      .card { stroke-width: 2.4; filter: url(#shadow); }
      .input { fill: #ecfdf5; stroke: #10b981; }
      .process { fill: url(#mainGrad); stroke: #f59e0b; }
      .score { fill: #eff6ff; stroke: #3b82f6; }
      .output { fill: #f8fafc; stroke: #475569; }
      .llm { fill: #fff7ed; stroke: #fb923c; stroke-dasharray: 9 7; }
      .fast { fill: #eef2ff; stroke: #6366f1; stroke-dasharray: 8 7; }
      .line { stroke: #475569; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#softArrow); stroke-dasharray: 8 8; }
      .thin { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .badge { fill: #0f172a; opacity: .92; }
      .badge-text { font: 800 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #fff; }
      .llm-chip { fill: #ffedd5; stroke: #fb923c; stroke-width: 1.8; }
      .llm-chip-text { font: 800 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #9a3412; }
      .cache-chip { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.6; }
      .cache-chip-text { font: 800 12px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1080"/>
  <circle cx="1545" cy="92" r="190" fill="#dbeafe" opacity=".34"/>
  <circle cx="210" cy="1000" r="260" fill="#fed7aa" opacity=".25"/>

  <text x="900" y="66" text-anchor="middle" class="title">影响力事件分发策略实验流程</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">从热点事件与微博用户图谱出发，生成面向执行的五维调度策略</text>

  <text x="110" y="164" class="section">实验输入</text>
  <rect x="90" y="185" rx="24" ry="24" width="370" height="170" class="card input"/>
  <text x="130" y="232" class="node-title">热点事件信息</text>
  <text x="130" y="266" class="node-text">事件标题 / 摘要 / 传播目标</text>
  <text x="130" y="296" class="node-text">风险等级与传播窗口约束</text>
  <text x="130" y="326" class="node-text">评测集中多种叙述变体</text>

  <rect x="500" y="185" rx="24" ry="24" width="390" height="170" class="card input"/>
  <text x="540" y="232" class="node-title">微博用户图谱数据</text>
  <text x="540" y="266" class="node-text">用户画像、兴趣、粉丝规模</text>
  <text x="540" y="296" class="node-text">互动关系与邻居连接</text>
  <text x="540" y="326" class="node-text">重构后的低冗余实验数据集</text>

  <rect x="940" y="185" rx="24" ry="24" width="770" height="170" class="card fast"/>
  <text x="980" y="232" class="node-title">实验约束</text>
  <text x="980" y="266" class="node-text">在线输出以低延迟为目标：完整事件输入到完整策略输出</text>
  <text x="980" y="296" class="node-text">默认仅在微博平台分发，不生成跨平台协同动作</text>
  <text x="980" y="326" class="node-text">LLM 可增强语义理解，但不应阻塞快速策略生成</text>

  <path d="M 275 355 C 275 420, 265 430, 265 475" class="soft-line"/>
  <path d="M 695 355 C 695 420, 265 430, 265 475" class="soft-line"/>

  <text x="110" y="435" class="section">在线处理流水线</text>
  <rect x="90" y="475" rx="28" ry="28" width="1620" height="318" fill="#ffffff" opacity=".72" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="190" y1="634" x2="1610" y2="634" class="thin"/>

  <g>
    <rect x="125" y="520" rx="22" ry="22" width="230" height="225" class="card process"/>
    <circle cx="165" cy="560" r="20" class="badge"/>
    <text x="165" y="566" text-anchor="middle" class="badge-text">1</text>
    <text x="190" y="567" class="node-title">事件理解</text>
    <text x="155" y="615" class="node-text">识别主题、目标</text>
    <text x="155" y="647" class="node-text">风险等级与约束</text>
    <text x="155" y="679" class="node-text">形成标准事件表示</text>
    <text x="155" y="718" class="tiny">输出：事件语义与调度约束</text>
    <rect x="235" y="532" rx="12" ry="12" width="96" height="28" class="llm-chip"/>
    <text x="283" y="551" text-anchor="middle" class="llm-chip-text">LLM 可选</text>
  </g>

  <path d="M 355 632 L 395 632" class="line"/>

  <g>
    <rect x="400" y="520" rx="22" ry="22" width="230" height="225" class="card score"/>
    <circle cx="440" cy="560" r="20" class="badge"/>
    <text x="440" y="566" text-anchor="middle" class="badge-text">2</text>
    <text x="465" y="567" class="node-title">节点表征</text>
    <text x="430" y="615" class="node-text">融合用户画像</text>
    <text x="430" y="647" class="node-text">关系强度与活跃度</text>
    <text x="430" y="679" class="node-text">生成可比较特征</text>
    <text x="430" y="718" class="tiny">输出：节点特征向量</text>
    <rect x="510" y="532" rx="12" ry="12" width="96" height="28" class="cache-chip"/>
    <text x="558" y="551" text-anchor="middle" class="cache-chip-text">LLM 缓存</text>
  </g>

  <path d="M 630 632 L 670 632" class="line"/>

  <g>
    <rect x="675" y="520" rx="22" ry="22" width="230" height="225" class="card score"/>
    <circle cx="715" cy="560" r="20" class="badge"/>
    <text x="715" y="566" text-anchor="middle" class="badge-text">3</text>
    <text x="740" y="567" class="node-title">候选检索</text>
    <text x="705" y="615" class="node-text">主题相关召回</text>
    <text x="705" y="647" class="node-text">过滤低信号节点</text>
    <text x="705" y="679" class="node-text">抑制泛高粉干扰</text>
    <text x="705" y="718" class="tiny">输出：候选数字人池</text>
    <rect x="785" y="532" rx="12" ry="12" width="96" height="28" class="cache-chip"/>
    <text x="833" y="551" text-anchor="middle" class="cache-chip-text">LLM 缓存</text>
  </g>

  <path d="M 905 632 L 945 632" class="line"/>

  <g>
    <rect x="950" y="520" rx="22" ry="22" width="230" height="225" class="card process"/>
    <circle cx="990" cy="560" r="20" class="badge"/>
    <text x="990" y="566" text-anchor="middle" class="badge-text">4</text>
    <text x="1015" y="567" class="node-title">综合评估</text>
    <text x="980" y="615" class="node-text">相关性与影响力</text>
    <text x="980" y="647" class="node-text">稳定性与风险门控</text>
    <text x="980" y="679" class="node-text">形成最终排序</text>
    <text x="980" y="718" class="tiny">输出：可选节点排名</text>
  </g>

  <path d="M 1180 632 L 1220 632" class="line"/>

  <g>
    <rect x="1225" y="520" rx="22" ry="22" width="230" height="225" class="card process"/>
    <circle cx="1265" cy="560" r="20" class="badge"/>
    <text x="1265" y="566" text-anchor="middle" class="badge-text">5</text>
    <text x="1290" y="567" class="node-title">角色化选择</text>
    <text x="1255" y="615" class="node-text">首发 / 互动</text>
    <text x="1255" y="647" class="node-text">扩散 / 支撑</text>
    <text x="1255" y="679" class="node-text">保证角色覆盖</text>
    <text x="1255" y="718" class="tiny">输出：主选数字人集合</text>
    <rect x="1335" y="532" rx="12" ry="12" width="96" height="28" class="llm-chip"/>
    <text x="1383" y="551" text-anchor="middle" class="llm-chip-text">LLM 可选</text>
  </g>

  <path d="M 1455 632 L 1495 632" class="line"/>

  <g>
    <rect x="1500" y="520" rx="22" ry="22" width="175" height="225" class="card output"/>
    <circle cx="1538" cy="560" r="20" class="badge"/>
    <text x="1538" y="566" text-anchor="middle" class="badge-text">6</text>
    <text x="1562" y="567" class="node-title">策略编排</text>
    <text x="1528" y="615" class="node-text">五维结构</text>
    <text x="1528" y="647" class="node-text">精简动作</text>
    <text x="1528" y="679" class="node-text">JSON 输出</text>
    <text x="1528" y="718" class="tiny">输出：调度策略</text>
    <rect x="1560" y="532" rx="12" ry="12" width="96" height="28" class="llm-chip"/>
    <text x="1608" y="551" text-anchor="middle" class="llm-chip-text">LLM 可选</text>
  </g>

  <text x="110" y="850" class="section">增强与评估机制</text>
  <rect x="90" y="875" rx="26" ry="26" width="500" height="140" class="card fast"/>
  <text x="130" y="920" class="node-title">在线快速路径</text>
  <text x="130" y="954" class="node-text">读取预处理数据与本地特征索引</text>
  <text x="130" y="984" class="node-text">规则检索、评分、选择与模板化输出</text>

  <rect x="650" y="875" rx="26" ry="26" width="500" height="140" class="card llm"/>
  <text x="690" y="920" class="node-title">离线 LLM 增强</text>
  <text x="690" y="954" class="node-text">事件理解、节点语义与候选校准可调用 LLM</text>
  <text x="690" y="984" class="node-text">结果写入缓存；在线快速路径可跳过 LLM</text>

  <rect x="1210" y="875" rx="26" ry="26" width="500" height="140" class="card output"/>
  <text x="1250" y="920" class="node-title">实验记录与性能统计</text>
  <text x="1250" y="954" class="node-text">保存各阶段中间结果用于复核</text>
  <text x="1250" y="984" class="node-text">统计完整事件输入到策略输出的耗时</text>

  <path d="M 900 875 C 900 820, 790 805, 790 745" class="soft-line"/>
  <path d="M 340 875 C 340 835, 610 815, 790 745" class="soft-line"/>
  <path d="M 1460 875 C 1460 835, 1588 810, 1588 745" class="soft-line"/>

  <rect x="1225" y="150" rx="18" ry="18" width="455" height="78" fill="#ffffff" opacity=".84" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="1260" y="182" class="tag">最终策略只保留五维：</text>
  <text x="1260" y="212" class="small">目标对象、时间、频率、平台、内容（含精简动作清单）</text>

  <rect x="1120" y="812" rx="18" ry="18" width="560" height="44" fill="#ffffff" opacity=".86" stroke="#fed7aa" stroke-width="1.6"/>
  <rect x="1150" y="822" rx="10" ry="10" width="88" height="24" class="llm-chip"/>
  <text x="1194" y="839" text-anchor="middle" class="llm-chip-text">LLM 可选</text>
  <text x="1260" y="839" class="small">在线链路中可启用，但为满足低延迟可关闭或设置超时回退</text>
  <rect x="1495" y="822" rx="10" ry="10" width="88" height="24" class="cache-chip"/>
  <text x="1539" y="839" text-anchor="middle" class="cache-chip-text">LLM 缓存</text>

  <rect x="90" y="1035" width="1620" height="1.5" fill="#cbd5e1"/>
  <text x="900" y="1062" text-anchor="middle" class="tiny">注：图中描述的是实验处理逻辑，省略具体函数与文件名；当前平台限定为微博模拟数据集。</text>
</svg>
