[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "influence-strategy"
version = "0.1.0"
description = "Lightweight baseline modules for influence event distribution strategy generation."
readme = "README.md"
requires-python = ">=3.11"
# 运行期依赖：一键启动脚本 `pip install -e .[ocr,semantic]` 会据此安装。
# （之前这里没有 dependencies，导致一键脚本装不到任何运行依赖，非 conda 环境必然启动失败。）
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "rapidfuzz>=3.9,<4",
    "networkx>=3.3,<4",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# BGE 语义编码的**运行期**依赖（ONNX 推理路径）。
# 走这条路就不需要安装 torch / transformers，首次加载从约 9s 降到约 1s。
# 没有 ONNX 产物时会自动回退 torch 路径，因此这两项缺失也不会报错。
semantic = ["onnxruntime>=1.16", "tokenizers>=0.15"]

# 图像事件输入的本地 OCR（纯 ONNX，不需要 GPU，也不依赖任何大模型）。
# 未安装时图像识别会返回 method="unrecognized" 而不是报错中断。
ocr = ["rapidocr_onnxruntime>=1.4", "Pillow>=10"]

# 仅在**离线导出/预计算**时需要（运行期不需要）：
#   scripts/export_bge_onnx.py  导出 ONNX（需 torch + transformers + onnx）
#   scripts/build_local_models.py  预计算节点向量与 GraphSAGE
#   pip install -e ".[export]"
export = ["torch>=2.0", "transformers>=4.30", "onnx>=1.15", "onnxscript"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
